version: '3.8'

services:
  # -------------------------------------------------------------
  # PostgreSQL with pgvector (Evidence Fabric & Entity Relational Store)
  # -------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ciphertrace_postgres
    restart: always
    environment:
      POSTGRES_USER: ciphertrace
      POSTGRES_PASSWORD: ciphertrace_secure_password_2026
      POSTGRES_DB: ciphertrace_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ciphertrace -d ciphertrace_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------
  # Neo4j Enterprise / Community (Graph Engine for Phases 4-7)
  # -------------------------------------------------------------
  neo4j:
    image: neo4j:5.18-community
    container_name: ciphertrace_neo4j
    restart: always
    environment:
      NEO4J_AUTH: neo4j/ciphertrace_neo4j_password_2026
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*,gds.*"
      NEO4J_dbms_memory_heap_initial__size: 512m
      NEO4J_dbms_memory_heap_max__size: 2G
    ports:
      - "7474:7474" # Neo4j Browser UI
      - "7687:7687" # Bolt Protocol
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

  # -------------------------------------------------------------
  # Redis (Task Queue, Cache & PubSub)
  # -------------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: ciphertrace_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # -------------------------------------------------------------
  # CIPHERTRACE X Backend API Service
  # -------------------------------------------------------------
  backend:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: ciphertrace_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_started
      redis:
        condition: service_started
    environment:
      - DATABASE_URL=postgresql://ciphertrace:ciphertrace_secure_password_2026@postgres:5432/ciphertrace_db
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=ciphertrace_neo4j_password_2026
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=production
    ports:
      - "8000:8000"
    volumes:
      - evidence_storage:/app/storage

  # -------------------------------------------------------------
  # CIPHERTRACE X Frontend Web Application
  # -------------------------------------------------------------
  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: ciphertrace_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
  redis_data:
  evidence_storage:
